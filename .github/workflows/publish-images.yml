name: Publish Docker images

on:
  push:
    branches:
      - ros2
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator
            target: tod_operator
            image: ghcr.io/sl-kai/teleoperated-driving-operator
          - name: vehicle
            target: tod_vehicle
            image: ghcr.io/sl-kai/teleoperated-driving-vehicle

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out Autoware Auto messages
        uses: actions/checkout@v4
        with:
          repository: tier4/autoware_auto_msgs
          ref: 624aae9feb142eb2a4e16069ed06bf4050ccc3ea
          path: src/external/autoware/messages/autoware_auto_msgs

      - name: Check out Tier4 Autoware messages
        uses: actions/checkout@v4
        with:
          repository: tier4/tier4_autoware_msgs
          ref: 12504f69041fb8c895ffb5625da63be2ea69da4b
          path: src/external/autoware/messages/tier4_autoware_msgs

      - name: Check out Autoware AD API messages
        uses: actions/checkout@v4
        with:
          repository: autowarefoundation/autoware_adapi_msgs
          ref: 5e36db1826da3a50f5c2f05f000e5d9cbd897553
          path: src/external/autoware/messages/autoware_adapi_msgs

      - name: Check out Autoware messages
        uses: actions/checkout@v4
        with:
          repository: autowarefoundation/autoware_msgs
          ref: f3ee114e1f3bf66a4df96d7dbfa209903c9cb75a
          path: src/external/autoware/messages/autoware_msgs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/ros2' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCKER_ROS_DISTRO=humble
            DOCKER_UID=1000
            DOCKER_GID=1000
            DOCKER_USERNAME=tum
            VEHICLE_BUILD_ARGS=--cmake-args -DVEHICLE=ON -DOPERATOR=OFF -DCMAKE_BUILD_TYPE=Release
            OPERATOR_BUILD_ARGS=--cmake-args -DVEHICLE=OFF -DOPERATOR=ON -DCMAKE_BUILD_TYPE=Release
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
